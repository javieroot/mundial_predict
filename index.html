<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Predictor Engine - Dashboard</title>
    <!-- Tailwind CSS (Se mantiene para consistencia futura) -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* Oculta la barra de scroll horizontal en las píldoras de filtro en celulares */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 🛡️ ESTILOS NATIVOS SUPREMOS (Obligan a la laptop a pintar el diseño oscuro tipo tarjeta sin depender de Tailwind) */
        body {
            background-color: #111827 !important;
            color: #f3f4f6 !important;
            font-family: system-ui, -apple-system, sans-serif !important;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1f2937 !important;
            border-bottom: 1px solid #374151 !important;
            padding: 1rem !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        main {
            max-w: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }
        .contenedor-tarjetas {
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 1.5rem !important;
            justify-content: center !important;
            padding-top: 1rem;
        }
        .tarjeta-partido {
            background-color: #1f2937 !important;
            border: 1px solid #374151 !important;
            border-radius: 1rem !important;
            overflow: hidden !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100% !important;
            max-width: 420px !important; /* Tamaño compacto estético de app móvil en laptop */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .encabezado-tarjeta {
            background-color: #111827 !important;
            border-b: 1px solid #374151 !important;
            padding: 0.5rem 1rem !important;
            font-size: 10px !important;
            color: #9ca3af !important;
            display: flex;
            justify-content: space-between;
        }
        .bloque-marcador {
            padding: 1rem !important;
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
        }
        .caja-goles {
            background-color: #111827 !important;
            border: 1px solid #374151 !important;
            border-radius: 0.75rem !important;
            padding: 0.5rem 1rem !important;
            font-family: monospace !important;
            font-size: 1.25rem !important;
            font-weight: bold !important;
            color: #34d399 !important;
        }
        .panel-votos {
            background-color: #111827 !important;
            border-top: 1px solid #374151 !important;
            padding: 0.75rem 1rem !important;
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
        }
        .panel-acordeon {
            background-color: #0f172a !important;
            padding: 1rem !important;
            border-top: 1px solid #374151 !important;
            font-size: 12px !important;
        }
        .linea-fuente {
            display: flex;
            justify-content: space-between;
            padding: 0.25rem 0;
            border-bottom: 1px solid #1e293b;
        }
        .linea-fuente:last-child { border: 0; }
        .font-mono { font-family: monospace !important; }
        input[type="text"] {
            background-color: #111827 !important;
            border: 1px solid #374151 !important;
            border-radius: 0.75rem !important;
            padding: 0.5rem 1rem !important;
            color: white !important;
            width: 100%;
            max-width: 300px;
        }
        button {
            background-color: #374151 !important;
            color: #9ca3af !important;
            border: 1px solid #4b5563 !important;
            padding: 0.5rem 1rem !important;
            border-radius: 9999px !important;
            cursor: pointer;
            font-size: 12px !important;
            font-weight: bold;
        }
        button:hover { color: white; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased min-h-screen">

    <!-- BARRA DE NAVEGACIÓN / CABECERA COMPACTA -->
    <header>
        <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <span style="font-size: 1.5rem;">📊</span>
                <h1 style="font-size: 1.25rem; font-weight: bold; color: #34d399; margin: 0;">Engine Predictor</h1>
                <span id="txt-torneo" style="font-size: 10px; background-color: #374151; padding: 0.25rem 0.5rem; border-radius: 0.25rem; color: #d1d5db; font-weight: bold; margin-left: 0.5rem;">Cargando...</span>
            </div>
            
            <!-- BUSCADOR INTERACTIVO PREDICTIVO -->
            <div>
                <input type="text" id="buscador" placeholder="🔍 Buscar país, club, estadio...">
            </div>

            <!-- PÍLDORAS DE FILTRO -->
            <div id="contenedor-filtros" style="display: flex; gap: 0.5rem; overflow-x: auto; max-width: 100%;">
                <!-- Se llenan dinámicamente -->
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <div style="font-size: 11px; color: #9ca3af; display: flex; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid #374151; padding-bottom: 0.5rem;">
            <span id="txt-fase">Fase: Cargando...</span>
            <span id="contador-partidos">Partidos: 0</span>
        </div>

        <!-- CONTENEDOR DINÁMICO DE TARJETAS DE PARTIDOS -->
        <div id="lista-partidos" class="contenedor-tarjetas">
            <div id="loading" style="text-center: center; padding: 3rem 0; color: #6b7280; width: 100%;">
                <p>Conectando con el enrutador dinámico...</p>
            </div>
        </div>
    </main>
    <!-- LÓGICA DE CONTROL JAVASCRIPT -->
    <script>
        let partidosGlobales = [];
        let filtroFaseActual = "Todos";

        // PASO 1: Doble lectura dinámica automática para optimizar la carga móvil
        document.addEventListener("DOMContentLoaded", () => {
            fetch('ruta_activa.json')
                .then(response => {
                    if (!response.ok) throw new Error("Falta ruta_activa.json en la raíz.");
                    return response.json();
                })
                .then(puntero => {
                    // Descarga en caliente el JSON exclusivo de la jornada actual
                    return fetch(puntero.url_resultados);
                })
                .then(response => {
                    if (!response.ok) throw new Error("No se pudo cargar el archivo histórico de la jornada.");
                    return response.json();
                })
                .then(data => {
                    partidosGlobales = data.partidos || [];
                    inicializarInterfaz(data);
                })
                .catch(error => {
                    console.error("❌ Error de inicialización:", error);
                    document.getElementById("lista-partidos").innerHTML = `
                        <div class="text-center py-10 px-4 text-red-400 text-xs border border-red-900 bg-red-950/20 rounded-xl max-w-md mx-auto mt-4 w-full">
                            <p class="font-bold mb-1">⚠️ Error de Sincronización con el Motor</p>
                            <p class="text-gray-500 font-mono text-[11px] mt-2 bg-gray-950 p-2 rounded border border-gray-800">${error.message}</p>
                        </div>
                    `;
                });
        });

        function inicializarInterfaz(data) {
            if (document.getElementById("loading")) document.getElementById("loading").remove();
            document.getElementById("txt-torneo").textContent = data.torneo;
            document.getElementById("txt-fase").textContent = `Fase: ${data.fase_activa}`;
            
            generarFiltrosPildora(partidosGlobales);
            renderizarTarjetas(partidosGlobales);

            document.getElementById("buscador").addEventListener("input", filtrarPartidos);
        }

        // Generar botones de filtrado rápido basados en los grupos/fases reales del JSON
        function generarFiltrosPildora(partidos) {
            const contenedor = document.getElementById("contenedor-filtros");
            const fases = ["Todos", ...new Set(partidos.map(p => p.grupo))];
            
            contenedor.innerHTML = fases.map((fase, idx) => `
                <button onclick="cambiarFiltroFase('${fase}', this)" 
                        class="pildora-filtro snap-center shrink-0 px-4 py-1.5 rounded-full text-xs font-semibold transition-all ${idx === 0 ? 'bg-emerald-500 text-gray-900' : 'bg-gray-800 text-gray-400 border border-gray-700'}">
                    ${fase}
                </button>
            `).join('');
        }

        function cambiarFiltroFase(fase, boton) {
            filtroFaseActual = fase;
            document.querySelectorAll(".pildora-filtro").forEach(b => {
                b.classList.remove("bg-emerald-500", "text-gray-900");
                b.classList.add("bg-gray-800", "text-gray-400", "border", "border-gray-700");
            });
            boton.classList.remove("bg-gray-800", "text-gray-400", "border", "border-gray-700");
            boton.classList.add("bg-emerald-500", "text-gray-900");

            filtrarPartidos();
        }
        // Renderizar las tarjetas unificando variables nativas M1 / M2 de tu Core
        function renderizarTarjetas(partidos) {
            const lista = document.getElementById("lista-partidos");
            if (partidos.length === 0) {
                lista.innerHTML = `<p class="text-center py-10 text-gray-500 text-xs w-full">No hay partidos en esta jornada.</p>`;
                return;
            }

            lista.innerHTML = partidos.map(p => {
                // Color dinámico según la tendencia de votos (M2) de tu Core
                const colorM2 = p.m2_tendencia_votos.includes("Local") ? "text-emerald-400 bg-emerald-950/40 border-emerald-800" : 
                                p.m2_tendencia_votos.includes("Visitante") ? "text-blue-400 bg-blue-950/40 border-blue-800" : "text-amber-400 bg-amber-950/40 border-amber-800";
                
                // Color dinámico del coeficiente de trazabilidad de origen
                const colorTrazabilidad = p.trazabilidad_origen.includes("mixto") ? "text-amber-400 border-amber-800 bg-amber-950/30" : "text-emerald-400 border-emerald-800 bg-emerald-950/30";
                
                const fuentes = p.consenso_fuentes || {};
                const marcasPermitidas = ["opta", "apuestas", "elo", "forebet", "predictz", "google_ai"];

                return `
                <div class="tarjeta-partido bg-gray-800 border border-gray-700 rounded-2xl overflow-hidden shadow-md transition-all flex flex-col justify-between" 
                     data-fase="${p.grupo}" data-search="${p.etiqueta_busqueda}">
                    
                    <div>
                        <!-- Encabezado superior informativo -->
                        <div class="px-4 py-2 bg-gray-850 border-b border-gray-700 flex justify-between items-center text-[10px] text-gray-400 font-medium">
                            <span>⏰ ${p.hora} | ${p.grupo}</span>
                            <span class="truncate max-w-[185px]">🏟️ ${p.estadio}</span>
                        </div>

                        <!-- Bloque Central: Metodología M1 (Marcador de tu Core) -->
                        <div class="p-4 flex justify-between items-center">
                            <div class="w-1/3 text-left font-bold text-xs text-gray-200 truncate">${p.local}</div>
                            <div class="w-1/3 text-center bg-gray-900 py-1.5 px-2 rounded-xl border border-gray-700 font-mono text-base font-bold text-emerald-400 shadow-inner">
                                ${p.m1_marcador_local} - ${p.m1_marcador_visitante}
                            </div>
                            <div class="w-1/3 text-right font-bold text-xs text-gray-200 truncate">${p.visitante}</div>
                        </div>
                    </div>

                    <div>
                        <!-- Panel de Metodología M2 (Votos y Confianza) -->
                        <div class="px-4 py-2.5 bg-gray-850 border-t border-gray-700/50 flex justify-between items-center flex-wrap gap-2">
                            <div class="flex items-center gap-1.5">
                                <span class="text-[9px] uppercase font-bold px-2 py-0.5 rounded border ${colorM2}">
                                    M2: ${p.m2_tendencia_votos}
                                </span>
                                <span class="text-[10px] font-mono text-gray-400 font-semibold">
                                    (${p.m2_confianza}%)
                                </span>
                            </div>
                            <button onclick="toggleAcordeon('${p.id_partido}', this)" class="text-xs text-emerald-400 hover:text-emerald-300 font-medium flex items-center gap-1 focus:outline-none text-[11px]">
                                <span>Detalle</span> <span class="icono-flecha transition-transform duration-200 text-[9px]">▼</span>
                            </button>
                        </div>

                        <!-- Acordeón Expandible (Consenso y Trazabilidad) -->
                        <div id="acordeon-${p.id_partido}" class="hidden bg-gray-900 px-4 py-3 border-t border-gray-700 space-y-2 text-xs">
                            <div class="flex justify-between items-center mb-1 pb-1 border-b border-gray-800">
                                <span class="text-gray-500 font-bold text-[9px] uppercase tracking-wider">Trazabilidad de Origen:</span>
                                <span class="text-[9px] font-mono px-1.5 py-0.5 rounded border uppercase font-bold ${colorTrazabilidad}">
                                    ${p.trazabilidad_origen}
                                </span>
                            </div>
                            
                            ${marcasPermitidas.map(fuente => {
                                const datosMarca = fuentes[fuente];
                                if (!datosMarca) return '';
                                
                                const alertas = p.alertas_fuentes || {};
                                const esRescate = alertas[fuente] === "rescate_activado";
                                const etiquetaAlerta = esRescate ? `<span class="text-[8px] bg-amber-950 text-amber-400 border border-amber-800 px-1 rounded font-mono font-bold">IFR</span>` : '';
                                
                                return `
                                    <div class="flex justify-between items-center py-1 border-b border-gray-850 last:border-0">
                                        <span class="capitalize text-gray-400 font-medium text-[11px]">${fuente}</span>
                                        <div class="flex items-center gap-2">
                                            ${etiquetaAlerta}
                                            <span class="font-mono font-bold bg-gray-800 px-2 py-0.5 rounded text-gray-300 text-[11px]">
                                                ${datosMarca[0]} - ${datosMarca[1]}
                                            </span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
            
            actualizarContador();
        }

        // Control de apertura/cierre táctil del acordeón
        function toggleAcordeon(id, boton) {
            const panel = document.getElementById(`acordeon-${id}`);
            const flecha = boton.querySelector(".icono-flecha");
            
            if (panel && panel.classList.contains("hidden")) {
                panel.classList.remove("hidden");
                flecha.classList.add("rotate-180");
            } else if (panel) {
                panel.classList.add("hidden");
                flecha.classList.remove("rotate-180");
            }
        }

        // Filtrado instantáneo combinado (Texto + Píldora activa)
        function filtrarPartidos() {
            const textoBuscador = document.getElementById("buscador").value.toLowerCase().trim();
            const tarjetas = document.querySelectorAll(".tarjeta-partido");

            tarjetas.forEach(tarjeta => {
                const faseTarjeta = tarjeta.getAttribute("data-fase");
                const textoTarjeta = tarjeta.getAttribute("data-search");

                const cumpleFase = (filtroFaseActual === "Todos" || faseTarjeta === filtroFaseActual);
                const cumpleTexto = textoTarjeta.includes(textoBuscador);

                if (cumpleFase && cumpleTexto) {
                    tarjeta.classList.remove("hidden");
                } else {
                    tarjeta.classList.add("hidden");
                }
            });

            actualizarContador();
        }

        function actualizarContador() {
            const visibles = document.querySelectorAll(".tarjeta-partido:not(.hidden)").length;
            document.getElementById("contador-partidos").textContent = `Partidos: ${visibles}`;
        }
    </script>
</body>
</html>
