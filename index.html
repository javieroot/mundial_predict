<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Predictor Engine - Dashboard</title>
    <!-- Tailwind CSS principal -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* Oculta la barra de scroll horizontal en las píldoras de filtro en celulares */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 🛡️ ESTILOS NATIVOS SUPREMOS (Obligan a la laptop a pintar el diseño oscuro sin depender de Tailwind) */
        body {
            background-color: #111827 !important;
            color: #f3f4f6 !important;
            font-family: system-ui, -apple-system, sans-serif !important;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1f2937 !important;
            border-bottom: 1px solid #374151 !important;
            padding: 1rem !important;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        main {
            max-w: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }
        .contenedor-tarjetas {
            display: flex !important;
            flex-wrap: wrap !important;
            gap: 1.5rem !important;
            justify-content: center !important;
            padding-top: 1rem;
        }
        .tarjeta-partido {
            background-color: #1f2937 !important;
            border: 1px solid #374151 !important;
            border-radius: 1rem !important;
            overflow: hidden !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100% !important;
            max-width: 420px !important; /* Tamaño compacto estético de app móvil en laptop */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .encabezado-tarjeta {
            background-color: #1a222f !important;
            border-bottom: 1px solid #374151 !important;
            padding: 0.5rem 1rem !important;
            font-size: 10px !important;
            color: #9ca3af !important;
            display: flex;
            justify-content: space-between;
        }
        .bloque-marcador {
            padding: 1.25rem 1rem !important;
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
        }
        .caja-goles {
            background-color: #111827 !important;
            border: 1px solid #374151 !important;
            border-radius: 0.75rem !important;
            padding: 0.5rem 1.25rem !important;
            font-family: monospace !important;
            font-size: 1.35rem !important;
            font-weight: bold !important;
            color: #34d399 !important;
            box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.6);
        }
        .panel-votos {
            background-color: #1a222f !important;
            border-top: 1px solid #374151 !important;
            padding: 0.75rem 1rem !important;
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
        }
        .panel-acordeon {
            background-color: #0f172a !important;
            padding: 1rem !important;
            border-top: 1px solid #374151 !important;
            font-size: 12px !important;
        }
        .linea-fuente {
            display: flex;
            justify-content: space-between;
            padding: 0.35rem 0;
            border-bottom: 1px solid #1e293b;
            align-items: center;
        }
        .linea-fuente:last-child { border: 0; }
        .font-mono { font-family: monospace !important; }
        input[type="text"] {
            background-color: #111827 !important;
            border: 1px solid #374151 !important;
            border-radius: 0.75rem !important;
            padding: 0.5rem 1rem !important;
            color: white !important;
            width: 100%;
            max-width: 300px;
        }
        .pildora-filtro {
            background-color: #374151 !important;
            color: #9ca3af !important;
            border: 1px solid #4b5563 !important;
            padding: 0.4rem 1rem !important;
            border-radius: 9999px !important;
            cursor: pointer;
            font-size: 11px !important;
            font-weight: bold;
            transition: all 0.2s;
        }
        .pildora-filtro:hover { color: white; border-color: #6b7280; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased min-h-screen">

    <!-- BARRA DE NAVEGACIÓN / CABECERA COMPACTA -->
    <header>
        <div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <span style="font-size: 1.5rem;">📊</span>
                <h1 style="font-size: 1.25rem; font-weight: bold; color: #34d399; margin: 0;">Engine Predictor</h1>
                <span id="txt-torneo" style="font-size: 10px; background-color: #374151; padding: 0.25rem 0.5rem; border-radius: 0.25rem; color: #d1d5db; font-weight: bold; margin-left: 0.5rem;">Cargando...</span>
            </div>
            
            <!-- BUSCADOR INTERACTIVO PREDICTIVO -->
            <div>
                <input type="text" id="buscador" placeholder="🔍 Buscar país, estadio...">
            </div>

            <!-- PÍLDORAS DE FILTRO -->
            <div id="contenedor-filtros" style="display: flex; gap: 0.5rem; overflow-x: auto; max-width: 100%;">
                <!-- Se llenan dinámicamente -->
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <div style="font-size: 11px; color: #9ca3af; display: flex; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid #374151; padding-bottom: 0.5rem;">
            <span id="txt-fase">Fase: Cargando...</span>
            <span id="contador-partidos">Partidos: 0</span>
        </div>

        <!-- CONTENEDOR DINÁMICO DE TARJETAS DE PARTIDOS -->
        <div id="lista-partidos" class="contenedor-tarjetas">
            <div id="loading" style="text-align: center; padding: 3rem 0; color: #6b7280; width: 100%;">
                <p>Conectando con el enrutador dinámico...</p>
            </div>
        </div>
    </main>
    <!-- LÓGICA DE CONTROL JAVASCRIPT CORREGIDA CON ESTRUCTURA NATIVA -->
    <script>
        let partidosGlobales = [];
        let filtroFaseActual = "Todos";

        document.addEventListener("DOMContentLoaded", () => {
            fetch('ruta_activa.json')
                .then(response => {
                    if (!response.ok) throw new Error("Falta ruta_activa.json en la raíz.");
                    return response.json();
                })
                .then(puntero => {
                    return fetch(puntero.url_resultados);
                })
                .then(response => {
                    if (!response.ok) throw new Error("No se pudo cargar el archivo histórico.");
                    return response.json();
                })
                .then(data => {
                    partidosGlobales = data.partidos || [];
                    inicializarInterfaz(data);
                })
                .catch(error => {
                    console.error("❌ Error:", error);
                    document.getElementById("lista-partidos").innerHTML = `
                        <div style="text-align: center; padding: 2rem; color: #f87171; border: 1px solid #7f1d1d; background-color: rgba(69, 10, 10, 0.2); border-radius: 0.75rem; width: 100%;">
                            <p>⚠️ Error de sincronización con el motor analítico.</p>
                        </div>
                    `;
                });
        });

        function inicializarInterfaz(data) {
            if (document.getElementById("loading")) document.getElementById("loading").remove();
            document.getElementById("txt-torneo").textContent = data.torneo;
            document.getElementById("txt-fase").textContent = `Fase: ${data.fase_activa}`;
            
            generarFiltrosPildora(partidosGlobales);
            renderizarTarjetas(partidosGlobales);

            document.getElementById("buscador").addEventListener("input", filtrarPartidos);
        }

        function generarFiltrosPildora(partidos) {
            const contenedor = document.getElementById("contenedor-filtros");
            const fases = ["Todos", ...new Set(partidos.map(p => p.grupo))];
            
            contenedor.innerHTML = fases.map((fase, idx) => `
                <button onclick="cambiarFiltroFase('${fase}', this)" class="pildora-filtro">
                    ${fase}
                </button>
            `).join('');
        }

        function cambiarFiltroFase(fase, boton) {
            filtroFaseActual = fase;
            filtrarPartidos();
        }
        // RENDERIZADO POR CLASES NATIVAS INTERACTIVAS
        function renderizarTarjetas(partidos) {
            const lista = document.getElementById("lista-partidos");
            if (partidos.length === 0) {
                lista.innerHTML = `<p style="text-align: center; color: #6b7280; font-size: 12px; width: 100%;">No hay partidos en esta jornada.</p>`;
                return;
            }

            lista.innerHTML = partidos.map(p => {
                const fuentes = p.consenso_fuentes || {};
                const marcasPermitidas = ["opta", "apuestas", "elo", "forebet", "predictz", "google_ai"];

                return `
                <div class="tarjeta-partido" data-fase="${p.grupo}" data-search="${p.etiqueta_busqueda}">
                    
                    <!-- Encabezado de Tarjeta -->
                    <div class="encabezado-tarjeta">
                        <span>⏰ ${p.hora} | ${p.grupo}</span>
                        <span>🏟️ ${p.estadio}</span>
                    </div>

                    <!-- Metodología M1: Marcador Ponderado Core -->
                    <div class="bloque-marcador">
                        <div style="width: 35%; font-weight: bold; font-size: 12px; text-align: left; color: #e5e7eb;">${p.local}</div>
                        <div class="caja-goles">${p.m1_marcador_local} - ${p.m1_marcador_visitante}</div>
                        <div style="width: 35%; font-weight: bold; font-size: 12px; text-align: right; color: #e5e7eb;">${p.visitante}</div>
                    </div>

                    <!-- Metodología M2: Tendencia de Votos y Confianza -->
                    <div class="panel-votos">
                        <div style="font-size: 11px; font-weight: bold; color: #34d399;">
                            M2: ${p.m2_tendencia_votos} <span style="color: #9ca3af; font-family: monospace; font-weight: normal; margin-left: 2px;">(${p.m2_confianza}%)</span>
                        </div>
                        <button onclick="toggleAcordeon('${p.id_partido}', this)" style="background: none !important; border: none !important; color: #34d399 !important; padding: 0 !important; font-size: 11px !important; font-weight: bold; cursor: pointer;">
                            Detalle ▼
                        </button>
                    </div>

                    <!-- 🔒 Acordeón de Trazabilidad Expandible (Oculto por defecto con display: none) -->
                    <div id="acordeon-${p.id_partido}" class="panel-acordeon" style="display: none;">
                        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #374151; padding-bottom: 0.25rem; margin-bottom: 0.5rem; items-center: center;">
                            <span style="color: #6b7280; font-size: 10px; font-weight: bold; uppercase: tracking-wider;">TRAZABILIDAD DE ORIGEN:</span>
                            <span style="color: #34d399; font-size: 10px; font-family: monospace; font-weight: bold;">${p.trazabilidad_origen}</span>
                        </div>
                        
                        <!-- Desglose de predicciones individuales -->
                        ${marcasPermitidas.map(fuente => {
                            const datosMarca = fuentes[fuente];
                            if (!datosMarca || datosMarca.length < 2) return '';
                            
                            const alertas = p.alertas_fuentes || {};
                            const esRescate = alertas[fuente] === "rescate_activado";
                            const etiquetaAlerta = esRescate ? `<span style="background-color: #78350f; color: #fbbf24; border: 1px solid #92400e; font-size: 8px; padding: 1px 4px; border-radius: 4px; font-weight: bold; margin-right: 6px; font-family: sans-serif;">IFR</span>` : '';
                            
                            return `
                                <div class="linea-fuente">
                                    <span style="color: #9ca3af; text-transform: capitalize; font-size: 11px; font-weight: 500;">${fuente}</span>
                                    <div style="display: flex; align-items: center;">
                                        ${etiquetaAlerta}
                                        <span class="font-mono" style="background-color: #374151; color: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px;">
                                            ${datosMarca[0]} - ${datosMarca[1]}
                                        </span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
                `;
            }).join('');
            
            actualizarContador();
        }

        // Control de alternancia de visualización del acordeón
        function toggleAcordeon(id, boton) {
            const panel = document.getElementById(`acordeon-${id}`);
            if (panel) {
                if (panel.style.display === "none") {
                    panel.style.display = "block";
                    boton.textContent = "Detalle ▲";
                } else {
                    panel.style.display = "none";
                    boton.textContent = "Detalle ▼";
                }
            }
        }

        function filtrarPartidos() {
            const textoBuscador = document.getElementById("buscador").value.toLowerCase().trim();
            const tarjetas = document.querySelectorAll(".tarjeta-partido");

            tarjetas.forEach(tarjeta => {
                const faseTarjeta = tarjeta.getAttribute("data-fase");
                const textoTarjeta = tarjeta.getAttribute("data-search");

                const cumpleFase = (filtroFaseActual === "Todos" || faseTarjeta === filtroFaseActual);
                const cumpleTexto = textoTarjeta.includes(textoBuscador);

                if (cumpleFase && cumpleTexto) {
                    tarjeta.style.display = "flex";
                } else {
                    tarjeta.style.display = "none";
                }
            });

            actualizarContador();
        }

        function actualizarContador() {
            const visibles = Array.from(document.querySelectorAll(".tarjeta-partido")).filter(t => t.style.display !== "none").length;
            document.getElementById("contador-partidos").textContent = `Partidos: ${visibles}`;
        }
    </script>
</body>
</html>
