name: Actualizacion Automatica de Predicciones

on:
  schedule:
    - cron: '0 23 * * *'    # Mantiene tu actualización diaria fija a las 11:00 PM
    - cron: '0 12 * * 5'    # Fuerza ejecución los Viernes a las 12:00 PM (Apertura del fin de semana Liga MX)
    - cron: '0 6 */3 * *'   # Despierta cada 3 días a las 6:00 AM (Monitoreo de fases en el Mundial)
  workflow_dispatch:        # Te permite disparar el motor manualmente con un clic en GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias desde requirements.txt
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Ejecutar Pipeline Analítico por Capas
      run: |
        # Capa 1: Descarga el fixture en caliente y guarda los datos brutos de la web con nulls
        python extractor.py
        
        # Capa 2: Analiza los nulls de la jornada y activa el rescate inyectando tus matrices de poder
        python estimador_fuentes.py
        
        # Capa 3: Calcula promedios ponderados enteros, define el origen [mixto/puro] y genera resultados_jornada.json
        python generador_resultados.py

    - name: Auto Guardar Base Histórica y Enrutador Dinámico
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "📊 Historial por jornada, matrices de poder autogeneradas y ruta_activa.json actualizados por sistema"
        file_pattern: '*'

    - name: Configurar Pages
      uses: actions/configure-pages@v5

    - name: Subir Artefacto Web Dinamico (Raiz)
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Desplegar en GitHub Pages en Vivo
      id: deployment
      uses: actions/deploy-pages@v4
