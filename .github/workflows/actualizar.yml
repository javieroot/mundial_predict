name: Actualizacion Diaria de Predicciones

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias desde requirements.txt
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar Pipeline Analítico por Etapas
      run: |
        # Etapa 1: El scraper peina la prensa y refina predicciones_base.json
        python extractor.py
        
        # Etapa 2: El predict toma la base, calcula M1/M2 con Pandas y crea resultados_dashboard.json
        python predict.py
        
        # Etapa 3: El actualizador busca marcadores finales en vivo e inyecta los resultados reales
        python actualizar_resultados.py


    - name: Auto Guardar Base Acumulada e Interfaz en GitHub
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "📊 Base acumulada, JSON de contingencia e index.html actualizados por sistema"
        file_pattern: '*'

    - name: Configurar Pages
      uses: actions/configure-pages@v5

    - name: Subir Artefacto Web Dinamico (Raiz)
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Desplegar en GitHub Pages en Vivo
      id: deployment
      uses: actions/deploy-pages@v4
