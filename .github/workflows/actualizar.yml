name: Actualizacion Diaria de Predicciones

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias del Modelo
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy

    - name: Ejecutar Script de Prediccion
      run: |
        python predict.py

    - name: Auto Guardar Base Acumulada e Interfaz en GitHub
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "📊 Base acumulada e index.html actualizados por sistema"
        file_pattern: 'partidos_acumulado.csv index.html'

    - name: Configurar Pages
      uses: actions/configure-pages@v5

    - name: Subir Artefacto Web Dinamico (Raiz)
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Desplegar en GitHub Pages en Vivo
      id: deployment
      uses: actions/deploy-pages@v4
