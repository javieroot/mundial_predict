name: Actualizacion Diaria de Predicciones

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 23:00 UTC
    - cron: '0 23 * * *'
  workflow_dispatch: # Activa el botón gris para ejecutar el script de forma manual bajo demanda

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso obligatorio para que el bot pueda escribir el archivo index.md

    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        # Si en el futuro necesitas librerías extra como numpy, se agregan aquí

    - name: Ejecutar Script de Prediccion
      run: |
        rm -f index.md
        python mundial_predict.py

    - name: Guardar Cambios en GitHub
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add index.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 Predicciones actualizadas por sistema" && git push)
