name: Actualizacion Diaria de Predicciones

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
    - name: Descargar Repositorio
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip

    - name: Ejecutar Script de Prediccion
      run: |
        rm -f index.md
        python mundial_predict.py

    - name: Guardar Cambios en GitHub
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add index.md
        
        # Verificar si hay cambios antes de hacer commit y forzar la URL con credenciales en el push
        if ! git diff --quiet --staged; then
          git commit -m "🔄 Predicciones actualizadas por sistema"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git
          git push origin main
        else
          print "No hay cambios detectados en el archivo index.md"
        fi
